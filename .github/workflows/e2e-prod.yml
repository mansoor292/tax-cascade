# E2E against production, after every deploy.
#
# Why this exists: the web app served a blank page for ~2 days (2026-08-29
# to -31) because a push rebuilt the Netlify site without a required env var.
# Every API health check stayed green the whole time — only the Playwright
# suite pointed at prod could see it, and nothing ran it. This makes that a
# machine's job.
#
# Push runs exclude @spend (Textract/Gemini-paying tests, ~$0.10/run); the
# nightly run includes them, so the document pipeline is exercised daily
# rather than per-push.
name: e2e-prod

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'   # nightly, 06:17 UTC
  workflow_dispatch:

concurrency:
  group: e2e-prod
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run: { working-directory: packages/web }
    env:
      BASE_URL: https://fin.catipult.ai
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Wait for the API deploy to converge on this commit
        if: github.event_name == 'push'
        run: |
          # The EC2 deploy webhook needs ~60s; a partial pm2 reload can leave
          # workers mixed, so require the SAME commit on repeated polls.
          for i in $(seq 1 40); do
            sleep 10
            SEEN=$(for _ in 1 2 3 4; do curl -s -m 8 https://tax-api.catalogshub.com/api/health | grep -o '"commit":"[^"]*"' ; done | sort -u)
            COUNT=$(echo "$SEEN" | grep -c commit || true)
            echo "t=$((i*10))s $SEEN"
            if [ "$COUNT" = "1" ] && echo "$SEEN" | grep -q "${GITHUB_SHA:0:7}"; then
              echo "converged"; exit 0
            fi
          done
          echo "API never converged on ${GITHUB_SHA:0:7}"; exit 1

      - name: Install
        run: npm ci --workspaces --include-workspace-root
        working-directory: .
      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: Run the suite (push = free tests only)
        if: github.event_name == 'push'
        run: npx playwright test --grep-invert @spend

      - name: Run the suite (nightly/manual = everything)
        if: github.event_name != 'push'
        run: npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: packages/web/test-results/
          retention-days: 14
