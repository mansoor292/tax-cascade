[build]
  base    = "packages/web"
  command = "npm install && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  VITE_API_URL           = "https://fin.catipult.ai"
  VITE_SUPABASE_URL      = "https://ophnjqjmxeohbyydxnlg.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9waG5qcWpteGVvaGJ5eWR4bmxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI2MzYyMDIsImV4cCI6MjA3ODIxMjIwMn0.ShmVLhmnCYuUBL6f6i1-TnMlpy_3MK4kezetcimA62c"

# ─── OAuth endpoints map to Netlify Functions ───
# Keep the user-visible URLs clean (/oauth/token instead of /.netlify/functions/oauth-token).
[[redirects]]
  from   = "/oauth/token"
  to     = "/.netlify/functions/oauth-token"
  status = 200
  force  = true

[[redirects]]
  from   = "/oauth/register"
  to     = "/.netlify/functions/oauth-register"
  status = 200
  force  = true

# /oauth/authorize is served by the React SPA (OAuthAuthorize.tsx). The SPA
# fallback below catches it.

# ─── Proxy the MCP + REST API to EC2 ───
# Users add https://fin.catipult.ai/mcp as the MCP server URL; Netlify transparently
# forwards the request to the Express API. Status 200 = rewrite, not redirect.
[[redirects]]
  from   = "/mcp"
  to     = "https://tax-api.catalogshub.com/mcp"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/*"
  to     = "https://tax-api.catalogshub.com/api/:splat"
  status = 200
  force  = true

# /auth/* is a SECOND backend surface, mounted separately from /api in
# server.ts (app.use('/auth', authRoutes)). It serves /auth/me and API-key
# create/revoke — the step that produces the key for the Claude connector.
#
# Without this rule the SPA fallback below swallowed it: POST /auth/api-keys
# hit index.html and returned a bare 404, and GET /auth/me returned HTML with
# a 200, so the key list silently rendered empty. Login was unaffected because
# it talks to Supabase directly, which is why this went unnoticed.
#
# Must stay ABOVE the SPA fallback — redirects are matched in order.
[[redirects]]
  from   = "/auth/*"
  to     = "https://tax-api.catalogshub.com/auth/:splat"
  status = 200
  force  = true

# ─── OAuth discovery metadata ───
# RFC 9728 / RFC 8414: when the resource has a PATH (ours is /mcp), a client
# derives the metadata URL by inserting the well-known segment BEFORE that
# path — https://host/.well-known/oauth-protected-resource/mcp — not by
# appending it to the host alone. Only the bare form existed, so the
# path-suffixed lookups fell through to the SPA fallback and returned an HTML
# page with a 200. A client asking for JSON metadata and receiving a web page
# reports the whole server as unreachable, which is what "Couldn't reach"
# meant.
#
# Both spellings are served, plus the OIDC-style /mcp/.well-known/... form.
# The files carry a .json extension so the content type comes from the
# extension rather than a headers rule.
#
# These MUST stay above the SPA fallback.
[[redirects]]
  from   = "/.well-known/oauth-protected-resource"
  to     = "/.well-known/oauth-protected-resource.json"
  status = 200
  force  = true

[[redirects]]
  from   = "/.well-known/oauth-protected-resource/*"
  to     = "/.well-known/oauth-protected-resource.json"
  status = 200
  force  = true

[[redirects]]
  from   = "/mcp/.well-known/oauth-protected-resource"
  to     = "/.well-known/oauth-protected-resource.json"
  status = 200
  force  = true

[[redirects]]
  from   = "/.well-known/oauth-authorization-server"
  to     = "/.well-known/oauth-authorization-server.json"
  status = 200
  force  = true

[[redirects]]
  from   = "/.well-known/oauth-authorization-server/*"
  to     = "/.well-known/oauth-authorization-server.json"
  status = 200
  force  = true

[[redirects]]
  from   = "/mcp/.well-known/oauth-authorization-server"
  to     = "/.well-known/oauth-authorization-server.json"
  status = 200
  force  = true

# ─── SPA fallback ───
# MUST come after the specific redirects above.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
